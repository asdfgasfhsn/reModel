<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remodel</title>
<script>
  // Old links (/?game=ID&...) go to the game's page, keeping other options.
  (() => {
    const params = new URLSearchParams(location.search);
    const game = params.get("game");
    if (!game) return;
    params.delete("game");
    const rest = params.toString();
    location.replace(`model2/${encodeURIComponent(game)}/${rest ? "?" + rest : ""}${location.hash}`);
  })();
</script>
<style>
  /* The logo's colours: black, white, blue, red and cyan wireframe. */
  :root { color-scheme: dark; --bg: #000; --fg: #f2f4f8; --dim: #8b93a3; --cyan: #2fe6ef; --blue: #2477ff;
    --red: #ff2436; --card: #070b12; --line: #163a44; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 1200px; min-height: 100vh; padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { text-align: center; padding: 8px 0 4px; }
  header img { width: min(560px, 100%); height: auto; aspect-ratio: 1086 / 362; display: block; margin: 0 auto; }
  header p { margin: 4px 0 0; color: var(--dim); }
  a { color: var(--cyan); }
  #continue { display: block; width: fit-content; max-width: 100%; margin: 20px auto 0; padding: 10px 22px; border-radius: 999px;
    border: 2px solid var(--cyan); color: var(--fg); text-decoration: none; font-weight: 700;
    box-shadow: 0 0 12px rgba(47, 230, 239, 0.35), inset 0 0 12px rgba(47, 230, 239, 0.15); }
  #continue:hover, #continue:focus-visible { background: rgba(47, 230, 239, 0.12); outline: none; }
  #continue[hidden] { display: none; }
  .note { margin: 16px auto 0; max-width: 640px; padding: 8px 12px; border-left: 3px solid var(--red); background: #140608; color: #f3c9cd; }
  .note[hidden] { display: none; }
  h2 { margin: 32px 0 14px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan);
    display: flex; align-items: center; gap: 12px; }
  h2::before { content: ""; width: 28px; height: 4px; background: var(--red); transform: skewX(-30deg); }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card);
    color: inherit; text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
  .card:hover, .card:focus-visible { border-color: var(--cyan); box-shadow: 0 0 18px rgba(47, 230, 239, 0.3); transform: translateY(-2px); outline: none; }
  /* The poster, with the attract mode screenshot inset at its foot. */
  .art { position: relative; aspect-ratio: 2 / 3; background: #05070b repeating-linear-gradient(90deg, transparent 0 31px, #0c1a22 31px 32px),
    repeating-linear-gradient(0deg, transparent 0 31px, #0c1a22 31px 32px); }
  .poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot { position: absolute; right: 10px; bottom: 10px; width: 46%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    border: 2px solid var(--cyan); border-radius: 4px; box-shadow: 0 2px 12px #000; transform-origin: bottom right;
    transition: transform 0.2s; }
  .card:hover .shot, .card:focus-visible .shot { transform: scale(1.9); }
  /* One column on a phone: crop the poster rather than fill the screen with it. */
  @media (max-width: 520px) { .art { aspect-ratio: 4 / 5; } }
  @media (prefers-reduced-motion: reduce) { .card, .shot { transition: none; } }
  .slot { position: relative; display: flex; flex-direction: column; }
  .slot .card { flex: 1; }
  .gear { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; display: grid; place-items: center;
    border-radius: 50%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--line); color: var(--fg);
    text-decoration: none; font-size: 22px; }
  .gear:hover, .gear:focus-visible { border-color: var(--cyan); color: var(--cyan); outline: none; }
  .body { padding: 12px 14px 14px; border-top: 3px solid var(--blue); }
  .title { margin: 0; font-size: 17px; font-weight: 800; font-style: italic; letter-spacing: 0.01em; }
  .meta { margin: 2px 0 10px; color: var(--dim); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: #c9d0dc; }
  kbd { display: inline-block; min-width: 1.6em; padding: 0 4px; margin-right: 2px; border: 1px solid #2c3a48; border-bottom-width: 2px;
    border-radius: 4px; font: 12px/1.5 ui-monospace, monospace; text-align: center; color: var(--fg); background: #0d141d; }
  footer { margin-top: 40px; color: var(--dim); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <img src="reModel-logo.png" alt="reModel" width="1086" height="362">
  <p>Sega Model 2 arcade games, in the browser</p>
</header>
<a id="continue" hidden></a>
<p class="note" id="nogpu" hidden>This browser has no WebGPU, which the games need: try a recent Chrome, Edge or Safari (on Linux, check chrome://gpu).</p>
<main id="games"></main>
<footer>Keyboard, gamepad or touch · <kbd>F</kbd> fullscreen · <kbd>H</kbd> hides the status bar · ⚙︎ or <kbd>Esc</kbd> settings<br><a href="LICENSE">MIT licence</a> · <a href="THIRD-PARTY-NOTICES.txt">third-party notices</a></footer>
<script type="module">
  if (!navigator.gpu) document.getElementById("nogpu").hidden = false;
  const main = document.getElementById("games");
  const el = (tag, props = {}, ...children) => {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...children);
    return e;
  };

  let games = [];
  try {
    const r = await fetch("games.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    games = (await r.json()).games;
  } catch (e) {
    main.append(el("p", { className: "note", textContent: `Couldn't load the game list (games.json): ${e.message ?? e}` }));
  }
  if (games.length === 0 && main.childElementCount === 0) {
    main.append(el("p", { className: "note", textContent: "No games: put a supported set's chips in the server's rom/<set>/ folder and run make web." }));
  }

  // One section per board, in board order (Model 2, 2A, 2B, 2C).
  const boards = [...new Set(games.map((g) => g.board))].sort();
  for (const board of boards) {
    const grid = el("div", { className: "grid" });
    for (const g of games.filter((g) => g.board === board)) {
      const art = el("div", { className: "art" });
      const image = (src, className, width, height) => {
        const img = el("img", { src, className, alt: "", loading: "lazy", decoding: "async", width, height });
        img.onerror = () => img.remove();
        art.append(img);
      };
      if (g.poster) image(g.poster, "poster", 600, 900);
      if (g.shot) image(g.shot, "shot", 480, 360);
      const controls = el("ul", { className: "controls" },
        ...g.controls.map((c) => el("li", {}, ...c.keys.map((k) => el("kbd", { textContent: k })), " " + c.label)));
      const card = el("a", { className: "card", href: g.page },
        art,
        el("div", { className: "body" },
          el("h3", { className: "title", textContent: g.title }),
          el("p", { className: "meta", textContent: `${g.year} · ${g.board}` }),
          controls));
      // Its settings panel, before the game starts (even if it's been
      // turned off for this game).
      const gear = el("a", { className: "gear", href: g.page + "#settings", textContent: "⚙︎",
        title: `${g.title}: settings`, ariaLabel: `${g.title}: settings` });
      grid.append(el("div", { className: "slot" }, card, gear));
    }
    main.append(el("section", {}, el("h2", { textContent: board }), grid));
  }

  // The last game played (the game page remembers it).
  let last = null;
  try {
    last = localStorage.getItem("remodel.last");
  } catch {}
  const lastGame = games.find((g) => g.id === last);
  if (lastGame) {
    const a = document.getElementById("continue");
    a.href = lastGame.page;
    a.textContent = `Continue: ${lastGame.title}`;
    a.hidden = false;
  }
</script>
</body>
</html>
