<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Remodel</title>
<!-- `make web` copies this page to model2/<set>/index.html, with @PKG@ set to
     the directory of the WebAssembly module for that set and @ROMSET@ to the
     folder under rom/ its chips are in (its own, or a clone's parent's). -->
<meta name="remodel-pkg" content="@PKG@">
<meta name="remodel-rom" content="@ROMSET@">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; display: block; }
  /* The logo while loading, fading out as the game starts. */
  #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; pointer-events: none; transition: opacity 0.5s; }
  #splash img { max-width: 70vw; max-height: 50vh; }
  /* Download progress under the logo. */
  #progress { width: min(420px, 70vw); height: 4px; border-radius: 2px; background: #1a2a33; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #2ee6ff; box-shadow: 0 0 8px #2ee6ff; transition: width 0.15s; }
  #ptext { color: #9ab; font-variant-numeric: tabular-nums; min-height: 1.4em; text-align: center; padding: 0 16px; }
  #splash.gone { opacity: 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(0, 0, 0, 0.6); display: flex; gap: 16px; flex-wrap: wrap; }
  #bar.hidden { display: none; }
  #status { color: #fff; }
  /* Back to the game list; not in fullscreen. */
  #back { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    padding: 4px 10px; border-radius: 14px; background: rgba(0, 0, 0, 0.5); color: #fff; text-decoration: none;
    opacity: 0.6; z-index: 1; }
  #back:hover, #back:focus { opacity: 1; }
  :fullscreen #back { display: none; }
  kbd { border: 1px solid #555; border-radius: 3px; padding: 0 4px; font: inherit; }
  /* On-screen controls (touch.js) */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch * { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #touch [hidden] { display: none; }
  #t-steer { position: absolute; left: 0; top: 18%; bottom: 0; width: 45%; }
  #t-knob { position: absolute; width: 64px; height: 64px; margin: -34px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.3); display: none; pointer-events: none; }
  #t-knob.on { display: block; }
  #t-knob::after { content: ""; position: absolute; left: 16px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.85); box-shadow: 0 1px 4px #000; transform: translateX(var(--dx, 0)); }
  #t-actions { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: auto auto; gap: 14px; align-items: end; justify-items: center; }
  #t-top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; }
  /* Dark fill, light outline and shadowed text: readable over sky and road alike. */
  .t-btn, .t-pill { background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.75); color: #fff;
    font: 700 13px system-ui, sans-serif; text-shadow: 0 1px 2px #000; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .t-btn { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; }
  .t-btn.big { width: 88px; height: 88px; font-size: 15px; }
  .t-pill { min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 22px;
    display: grid; place-items: center; }
  .t-btn.on, .t-pill.on { background: rgba(255, 255, 255, 0.8); color: #000; text-shadow: none; }
  /* The gamepad's gun cursor (gun.js) */
  #crosshair { position: fixed; width: 28px; height: 28px; margin: -16px; border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000; pointer-events: none; }
  #crosshair[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="splash"><img src="../../reModel-logo.png" alt="reModel">
  <div id="progress"><div id="fill"></div></div><div id="ptext">loading…</div></div>
<a id="back" href="../../">← Games</a>
<div id="bar">
  <span id="status">loading…</span>
  <span><span id="keys"></span>gamepad works too ·
    <kbd>F</kbd> fullscreen <kbd>H</kbd> hide bar · <span id="sound">tap or press a key for sound</span></span>
</div>
<div id="touch" hidden>
  <div id="t-steer"><div id="t-knob"></div></div>
  <!-- touch.js adds the game's buttons (touch_layout) -->
  <div id="t-top">
    <span class="t-pill" id="t-tilt">Tilt</span>
    <span class="t-pill" id="t-info">ⓘ</span>
  </div>
  <div id="t-actions"></div>
</div>
<script type="module">
  import { setupTouch } from "../touch.js";
  import { setupGun } from "../gun.js";

  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  // The set is in the path (/model2/ID/); its ROM files are at /rom/ID/,
  // or in the parent set's folder for a clone (the meta tag above).
  const game = decodeURIComponent(location.pathname.match(/\/model2\/([^/]+)/)?.[1] ?? "topskatr");
  const romset = document.querySelector('meta[name="remodel-rom"]')?.content ?? game;
  const rom = new URL(`../../rom/${romset.startsWith("@") ? game : romset}`, location.href).href;
  // This set's WebAssembly module: its own with recompiled code, or the
  // shared interpreter build (the meta tag above).
  const pkg = new URL(document.querySelector('meta[name="remodel-pkg"]').content, location.href).href;
  const { default: init, start, set_audio_level, set_geo_frame, set_touch, set_gun, view_point, stick_cursor,
    controls_help, touch_layout, game_title, rom_files } =
    await import(pkg + "remodel_web.js");
  // For the game list's "Continue".
  try {
    localStorage.setItem("remodel.last", game);
  } catch {}
  // Defaults: fill this window (4:3 to 21:9) at the screen's resolution.
  const fit = Math.min(Math.max(innerWidth / innerHeight, 4 / 3), 21 / 9);
  const aspect = params.has("aspect")
    ? params.get("aspect").split(":").map(Number).reduce((w, h) => w / h)
    : fit;
  const height = Number(params.get("height")) ||
    Math.min(1080, Math.round(innerHeight * devicePixelRatio / 2) * 2);
  const hudEdges = params.get("hud") !== "center";
  const sound = params.get("sound") !== "0";
  // Mix in dB (sound board: effects and announcer; music board), if set.
  const mix = params.has("sfx") || params.has("music")
    ? [Number(params.get("sfx") ?? 8), Number(params.get("music") ?? -8)]
    : undefined;

  // Browsers only start audio from a user gesture: set it up on the first.
  let audio = null;
  let started = false;
  const soundLabel = document.getElementById("sound");
  // The sound boards run in a worker on another core (sound-worker.js).
  let worker = null;
  let workerMs = 0;
  let workerState = "loading";
  let geoMs = 0;
  async function enableAudio() {
    if (!sound) return;
    if (audio) {
      // iOS can suspend or interrupt the context: any later gesture resumes it.
      if (audio.state !== "running") audio.resume();
      return;
    }
    // Safari 17+: play as media, not "ambient" sound that silent mode mutes.
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    audio = new AudioContext({ sampleRate: 44100, latencyHint: "interactive" });
    audio.resume();
    soundLabel.textContent = "sound: starting";
    try {
      await audio.audioWorklet.addModule("../audio-worklet.js");
    } catch (e) {
      soundLabel.textContent = "sound: worklet failed: " + (e.message ?? e);
      return;
    }
    const node = new AudioWorkletNode(audio, "remodel-sink", { outputChannelCount: [2] });
    node.connect(audio.destination);
    // The worker posts its audio straight into the worklet.
    const channel = new MessageChannel();
    node.port.postMessage({ port: channel.port1 }, [channel.port1]);
    worker.postMessage({ type: "port", port: channel.port2 }, [channel.port2]);
    node.port.onmessage = (e) => {
      const s = e.data;
      if ("level" in s) {
        if (started) set_audio_level(s.level);
        return;
      }
      const db = s.played ? (10 * Math.log10(s.energy / s.played)).toFixed(0) : "-inf";
      soundLabel.textContent = `sound: ${audio.state}, ${audio.sampleRate} Hz, ` +
        `worker ${workerState} ${workerMs.toFixed(1)} ms/frame, geometry worker ${geoMs.toFixed(1)} ms/frame, ` +
        `playing ${db} dB, ${s.dry} dry, ` +
        `${(s.queued / 44.1).toFixed(0)} ms queued`;
    };
  }
  for (const ev of ["pointerdown", "keydown", "touchend"]) addEventListener(ev, enableAudio);
  if (!sound) soundLabel.textContent = "sound off";

  const toggleBar = () => document.getElementById("bar").classList.toggle("hidden");
  addEventListener("keydown", (e) => {
    if (e.code === "KeyF") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (e.code === "KeyH") toggleBar();
  });

  // Loading progress on the splash.
  const fill = document.getElementById("fill");
  const ptext = document.getElementById("ptext");
  const mb = (n) => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
  function progress(label, done, total) {
    fill.style.width = total ? `${Math.min(100, (100 * done) / total)}%` : "0";
    ptext.textContent = total ? `${label} ${mb(done)} / ${mb(total)} MB` : label;
  }
  // Fetch URLs (at most four at once), reporting bytes as they arrive.
  async function download(urls, label) {
    const got = new Array(urls.length).fill(0);
    const size = new Array(urls.length).fill(0);
    const update = () => progress(label, got.reduce((a, b) => a + b, 0), size.reduce((a, b) => a + b, 0));
    const out = new Array(urls.length);
    let next = 0;
    async function one() {
      while (next < urls.length) {
        const i = next++;
        const r = await fetch(urls[i]);
        if (!r.ok) throw new Error(`${urls[i]}: ${r.status} ${r.statusText}`);
        size[i] = Number(r.headers.get("content-length")) || 0;
        const reader = r.body.getReader();
        const parts = [];
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value);
          got[i] += value.length;
          update();
        }
        out[i] = new Blob(parts);
      }
    }
    await Promise.all(Array.from({ length: Math.min(4, urls.length) }, one));
    return out;
  }

  if (!navigator.gpu) {
    ptext.textContent = "This browser has no WebGPU.";
    status.textContent = "This browser has no WebGPU (try a recent Chrome, Edge or Safari; on Linux, check chrome://gpu).";
  } else {
    try {
      // Compile once; the workers instantiate the same module.
      const [code] = await download([pkg + "remodel_web_bg.wasm"], "Game code");
      progress("Compiling…");
      const module = await WebAssembly.compile(await code.arrayBuffer());
      await init({ module_or_path: module });
      // The ROMs, once, before anything else asks for them: the workers and
      // the game then get them from the browser's cache.
      await download(rom_files(game).map((f) => `${rom}/${f}`), "ROMs");
      progress("Starting…");
      document.title = `${game_title(game)} · Remodel`;
      document.getElementById("keys").textContent = controls_help(game).trim().replace(/\n\s*/g, " · ").replace(/ {2,}/g, " ") + " · ";
      // Touch screens: on-screen controls (the game's, from its pad
      // bindings), and the bar out of the way until ⓘ.
      const report = (steer, right, left, buttons) => started && set_touch(steer, right, left, buttons);
      const layout = JSON.parse(touch_layout(game));
      // Gun games: the mouse or a tap aims and fires (gun.js).
      let gun;
      if (layout.gun) {
        const canvas = document.getElementById("screen");
        gun = setupGun(canvas, (x, y) => (started ? view_point(x, y) : []),
          (p, x, y, on, b) => started && set_gun(p, x, y, on, b));
        const track = () => {
          if (started) gun.cursor(stick_cursor());
          requestAnimationFrame(track);
        };
        requestAnimationFrame(track);
      }
      if (setupTouch(layout, report, toggleBar, gun)) toggleBar();
      let link;
      if (sound) {
        worker = new Worker("../sound-worker.js", { type: "module" });
        worker.onmessage = (e) => {
          const m = e.data;
          if (m.type === "stats") workerMs = m.msPerFrame;
          else if (m.type === "ready") workerState = "running";
          else if (m.type === "error") soundLabel.textContent = "sound worker: " + m.message;
        };
        try {
          worker.postMessage({ type: "init", pkg, module, game, rom, mix });
        } catch {
          // Browsers that can't pass a compiled module: the worker fetches it.
          worker.postMessage({ type: "init", pkg, game, rom, mix });
        }
        link = (cycles, bytes, until, ratio) =>
          worker.postMessage({ type: "link", cycles, bytes, until, ratio }, [cycles.buffer, bytes.buffer]);
      }
      // The geometrizer runs in its own worker too (?geo=local keeps it on
      // this thread).
      let geo;
      if (params.get("geo") !== "local") {
        const gw = new Worker("../geo-worker.js", { type: "module" });
        gw.onmessage = (e) => {
          const m = e.data;
          if (m.type === "frame") set_geo_frame(m.stream, m.points);
          else if (m.type === "stats") geoMs = m.msPerFrame;
          else if (m.type === "error") status.textContent = "geometry worker: " + m.message;
        };
        try {
          gw.postMessage({ type: "init", pkg, module, game, rom });
        } catch {
          gw.postMessage({ type: "init", pkg, game, rom });
        }
        geo = (kind, data, booted, readPtr, jumps) =>
          kind === "boot"
            ? gw.postMessage({ type: "boot", program: data }, [data.buffer])
            : gw.postMessage({ type: "frame", buffer: data, booted, readPtr, jumps }, [data.buffer, jumps.buffer]);
      }
      await start(game, document.getElementById("screen"), status, rom, height, aspect, hudEdges, link, geo);
      started = true;
      // Fade the logo once it's been up for 1.5 s.
      const splash = document.getElementById("splash");
      setTimeout(() => splash.classList.add("gone"), Math.max(0, 1500 - performance.now()));
      splash.addEventListener("transitionend", () => splash.remove());
    } catch (e) {
      status.textContent = "error: " + (e.message ?? e);
      ptext.textContent = "Couldn't start: " + (e.message ?? e);
      ptext.style.color = "#f66";
      console.error(e);
    }
  }
</script>
</body>
</html>
