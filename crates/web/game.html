<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>reModel</title>
<!-- `make web` copies this page to model2/<set>/index.html, with @PKG@ set to
     the directory of the WebAssembly module for that set and @ROMSET@ to the
     folder under rom/ its chips are in (its own, or a clone's parent's). -->
<meta name="remodel-pkg" content="@PKG@">
<meta name="remodel-rom" content="@ROMSET@">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; display: block; }
  /* The game's bezel, behind the canvas: it shows where the canvas is
     letterboxed beside a 4:3 picture (placed by placeBezel). */
  #bezel { position: fixed; pointer-events: none; user-select: none; }
  #bezel[hidden] { display: none; }
  /* The logo while loading, fading out as the game starts. */
  #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; pointer-events: none; transition: opacity 0.5s; }
  #splash img { max-width: 70vw; max-height: 50vh; }
  /* Download progress under the logo. */
  #progress { width: min(420px, 70vw); height: 4px; border-radius: 2px; background: #1a2a33; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #2ee6ff; box-shadow: 0 0 8px #2ee6ff; transition: width 0.15s; }
  #ptext { color: #9ab; font-variant-numeric: tabular-nums; min-height: 1.4em; text-align: center; padding: 0 16px; }
  #splash.gone { opacity: 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 12px; background: rgba(0, 0, 0, 0.6); display: flex; gap: 16px; flex-wrap: wrap; }
  #bar.hidden { display: none; }
  #status { color: #fff; }
  /* Back to the game list; not in fullscreen. */
  #back { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    padding: 4px 10px; border-radius: 14px; background: rgba(0, 0, 0, 0.5); color: #fff; text-decoration: none;
    opacity: 0.6; z-index: 1; }
  #back:hover, #back:focus { opacity: 1; }
  :fullscreen #back { display: none; }
  /* Settings (panel.js): before the game starts, and in the bar. */
  #gear { position: fixed; right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top));
    width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0, 0, 0, 0.5); color: #fff;
    font-size: 22px; opacity: 0.7; z-index: 1; cursor: pointer; }
  #gear:hover, #gear:focus { opacity: 1; }
  #gear[hidden] { display: none; }
  #bar-gear { margin-left: auto; padding: 0 8px; border: 1px solid #555; border-radius: 10px; background: none;
    color: inherit; font: inherit; cursor: pointer; }
  kbd { border: 1px solid #555; border-radius: 3px; padding: 0 4px; font: inherit; }
  /* On-screen controls (touch.js) */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch * { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #touch [hidden] { display: none; }
  #t-steer { position: absolute; left: 0; top: 18%; bottom: 0; width: 45%; }
  #t-knob { position: absolute; width: 64px; height: 64px; margin: -34px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.3); display: none; pointer-events: none; }
  #t-knob.on { display: block; }
  #t-knob::after { content: ""; position: absolute; left: 16px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.85); box-shadow: 0 1px 4px #000; transform: translateX(var(--dx, 0)); }
  #t-actions { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: auto auto; gap: 14px; align-items: end; justify-items: center; }
  #t-top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; }
  /* Dark fill, light outline and shadowed text: readable over sky and road alike. */
  .t-btn, .t-pill { background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.75); color: #fff;
    font: 700 13px system-ui, sans-serif; text-shadow: 0 1px 2px #000; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .t-btn { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; }
  .t-btn.big { width: 88px; height: 88px; font-size: 15px; }
  .t-pill { min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 22px;
    display: grid; place-items: center; }
  .t-btn.on, .t-pill.on { background: rgba(255, 255, 255, 0.8); color: #000; text-shadow: none; }
  /* The gamepad's gun cursor (gun.js) */
  #crosshair { position: fixed; width: 28px; height: 28px; margin: -16px; border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 0 0 2px #000, inset 0 0 0 2px #000; pointer-events: none; }
  #crosshair[hidden] { display: none; }
</style>
</head>
<body>
<img id="bezel" alt="" hidden>
<canvas id="screen"></canvas>
<div id="splash"><img src="../../reModel-logo.png" alt="reModel">
  <div id="progress"><div id="fill"></div></div><div id="ptext">loading…</div></div>
<a id="back" href="../../">← Games</a>
<button id="gear" type="button" aria-label="Settings" hidden>⚙︎</button>
<div id="bar">
  <span id="status">loading…</span>
  <span><span id="keys"></span>gamepad works too ·
    <kbd>F</kbd> fullscreen <kbd>H</kbd> hide bar · <span id="sound">tap or press a key for sound</span></span>
  <button id="bar-gear" type="button">⚙︎ Settings <kbd>Esc</kbd></button>
</div>
<div id="touch" hidden>
  <div id="t-steer"><div id="t-knob"></div></div>
  <!-- touch.js adds the game's buttons (touch_layout) -->
  <div id="t-top">
    <span class="t-pill" id="t-tilt">Tilt</span>
    <span class="t-pill" id="t-info">ⓘ</span>
    <span class="t-pill" id="t-gear" aria-label="Settings">⚙︎</span>
  </div>
  <div id="t-actions"></div>
</div>
<script type="module">
  import { setupTouch, touchScreen, tiltPermission } from "../touch.js";
  import { setupGun } from "../gun.js";
  import * as S from "../settings.js";
  import { createPanel } from "../panel.js";

  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  // The set is in the path (/model2/ID/); its ROM files are at /rom/ID/,
  // or in the parent set's folder for a clone (the meta tag above).
  const game = decodeURIComponent(location.pathname.match(/\/model2\/([^/]+)/)?.[1] ?? "topskatr");
  const romset = document.querySelector('meta[name="remodel-rom"]')?.content ?? game;
  const rom = new URL(`../../rom/${romset.startsWith("@") ? game : romset}`, location.href).href;
  // This set's WebAssembly module: its own with recompiled code, or the
  // shared interpreter build (the meta tag above).
  const pkg = new URL(document.querySelector('meta[name="remodel-pkg"]').content, location.href).href;
  const { default: init, start, set_geo_frame, set_touch, set_gun, view_point, stick_cursor, set_audio_level,
    set_paused, set_hud, controls_help, touch_layout, game_title, rom_files, set_bindings, bindings_view,
    bindings_capture, bindings_edit, set_smooth, set_audio_buffer, set_quality, set_pack, pack_wanted, pack_image,
    pack_missing, pack_sets, game_crease, shading_cost } =
    await import(pkg + "remodel_web.js");

  // Settings (settings.js): built-in defaults < stored for all games <
  // stored for this game < this page's URL. The page works without storage.
  const storage = (() => {
    try {
      return localStorage;
    } catch {
      return null;
    }
  })();
  // For the game list's "Continue".
  try {
    storage?.setItem("remodel.last", game);
  } catch {}
  // A phone or tablet (a coarse main pointer, or iOS, where every browser
  // is WebKit and an iPad may say it's a Mac): a bigger audio buffer by
  // default (settings.js `audioBuffer`).
  const phone = matchMedia("(pointer: coarse)").matches || /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const env = () => ({ innerWidth, innerHeight, devicePixelRatio, touchScreen: touchScreen(), phone });
  const base = S.builtin(env());
  const url = S.fromParams(params);
  let store = S.readStore(storage);
  let { values, source } = S.resolve(base, store, game, url);
  // #settings (the game list's gear) shows the panel even if it's off for
  // this game; #play (a restart from the panel) skips it once.
  const hash = location.hash;
  const clean = () => location.pathname + (params.size ? "?" + params : "");
  if (hash === "#settings" || hash === "#play") history.replaceState(null, "", clean());
  const showFirst = hash === "#settings" || (hash !== "#play" && !store.skip[game]);
  // Reload with the settings saved, without the panel.
  const restart = () => {
    history.replaceState(null, "", clean() + "#play");
    location.reload();
  };

  // The title and the bezel art, from the game list's data (the module
  // isn't loaded yet).
  let title = game;
  let bezelUrl = null;
  try {
    const r = await fetch("../../games.json");
    const entry = (await r.json()).games.find((g) => g.id === game);
    title = entry?.title ?? game;
    if (entry?.bezel) bezelUrl = new URL(`../../${entry.bezel}`, location.href).href;
  } catch {}

  // The settings the game is running with (null before it starts), and
  // the live parts' handles once it has.
  let run = null;
  let started = false;
  let touch = null;
  let worker = null;
  let tiltAsk = null;
  // The game's bezel (settings.js `bezelRect`): with the bezel setting on,
  // beside a 4:3 picture (the aspect the game started with) in a wider
  // window; loaded the first time it shows.
  const bezel = document.getElementById("bezel");
  let startAspect = null;
  function placeBezel() {
    // (Whether it shows doesn't depend on the art's size.)
    const on = !!(run?.bezel && bezelUrl && startAspect !== null && S.bezelRect(env(), startAspect, true, 16, 9));
    if (on && !bezel.getAttribute("src")) {
      bezel.addEventListener("load", placeBezel, { once: true });
      bezel.src = bezelUrl;
      return;
    }
    const r = on && bezel.naturalWidth
      ? S.bezelRect(env(), startAspect, true, bezel.naturalWidth, bezel.naturalHeight) : null;
    bezel.hidden = !r;
    if (r) {
      for (const k of ["left", "top", "width", "height"]) bezel.style[k] = `${r[k]}px`;
    }
  }
  addEventListener("resize", placeBezel);
  const panel = createPanel({ title, back: "../../", env: env(), base, values, source, skip: !!store.skip[game],
    onGesture(action, v) {
      // Still in the tap or key press: audio and the motion permission.
      if (v.touch && v.tilt && (!run || !run.tilt)) tiltAsk = tiltPermission();
      if (action === "play") {
        if (v.sound) enableAudio(v);
      } else if (action === "resume") {
        audio?.resume();
      }
    },
  });
  // Save what the panel chose: a URL override the player changed leaves
  // the address, so the panel's value holds from now on.
  function save(r) {
    values = r.values;
    for (const k of r.changed) {
      params.delete(k);
      delete url[k];
    }
    if (r.changed.size) history.replaceState(null, "", clean());
    store = S.commit(base, S.readStore(storage), game, values,
      { forAll: r.forAll, skip: r.skip, keep: Object.keys(url) });
    if (storage) S.writeStore(storage, store);
  }
  // Before the game starts: Play (or Restart, the same then).
  let choice = null;
  const gear = document.getElementById("gear");
  const openFirst = () => {
    gear.hidden = true;
    choice = panel.show("start").then((r) => {
      save(r);
      if (!started) gear.hidden = false;
      return r;
    });
  };
  gear.addEventListener("click", openFirst);
  if (showFirst) openFirst();
  else gear.hidden = false;
  // In game: pause, show, then apply what can change live; the rest
  // restarts the page.
  async function openInGame() {
    if (!started || panel.open) return;
    set_paused(true);
    audio?.suspend();
    const r = await panel.show("game", run);
    const before = run;
    save(r);
    if (r.action === "restart") return restart();
    set_hud(values.hud !== "center");
    const q = S.effective(values, env());
    set_quality(q.aa, q.depth, q.texFilter, q.shading, q.crease, q.shadingFine);
    geoWorker?.postMessage({ type: "set", light: wantsLight(q) });
    if (values.pack !== before.pack) usePack(values.pack);
    set_bindings(values.controls);
    showKeys();
    worker?.postMessage({ type: "mix", mix: [values.sfx, values.music] });
    if (touch && values.touch !== before.touch) {
      touch.show(values.touch);
      if (values.touch && values.tilt) touch.tilt(true, tiltAsk ?? tiltPermission());
    }
    if (touch && values.tilt !== before.tilt) touch.tilt(values.tilt, tiltAsk ?? tiltPermission());
    tiltAsk = null;
    run = { ...run, hud: values.hud, bezel: values.bezel, aa: values.aa, depth: values.depth, shading: values.shading,
      crease: values.crease, pack: values.pack, texfilter: values.texfilter, sfx: values.sfx, music: values.music, touch: values.touch,
      tilt: values.tilt, controls: values.controls };
    placeBezel();
    set_paused(false);
  }
  document.getElementById("bar-gear").addEventListener("click", openInGame);
  document.getElementById("t-gear").addEventListener("click", openInGame);
  addEventListener("keydown", (e) => {
    if (e.code === "Escape") openInGame();
  });

  // Browsers only start audio from a user gesture: set it up on the first
  // (Play, or any tap or key press once the game runs).
  let audio = null;
  let node = null;
  let connected = false;
  const soundLabel = document.getElementById("sound");
  // The sound boards run in a worker on another core (sound-worker.js).
  let workerMs = 0;
  let workerState = "loading";
  let geoMs = 0;
  // The geometry worker, when the geometrizer runs in one: told whether to
  // record smooth shading's side channel (its `light` flag).
  let geoWorker = null;
  const wantsLight = (q) => !!q.shading && q.shading !== "flat" && q.crease !== 0;
  // The worklet and the worker, joined once both exist.
  function connectAudio() {
    if (connected || !node || !worker) return;
    connected = true;
    const channel = new MessageChannel();
    node.port.postMessage({ port: channel.port1 }, [channel.port1]);
    worker.postMessage({ type: "port", port: channel.port2 }, [channel.port2]);
  }
  async function enableAudio(v = run) {
    if (audio) {
      // iOS can suspend or interrupt the context: any later gesture resumes it.
      if (audio.state !== "running" && !panel.open) audio.resume();
      return;
    }
    // Safari 17+: play as media, not "ambient" sound that silent mode mutes.
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    audio = new AudioContext({ sampleRate: 44100, latencyHint: "interactive" });
    audio.resume();
    soundLabel.textContent = "sound: starting";
    try {
      await audio.audioWorklet.addModule("../audio-worklet.js");
    } catch (e) {
      soundLabel.textContent = "sound: worklet failed: " + (e.message ?? e);
      return;
    }
    node = new AudioWorkletNode(audio, "remodel-sink", { outputChannelCount: [2] });
    // Its priming and most, for the buffer setting (the game is started
    // with the same).
    const { prime, max } = S.audioBuffer((v ?? values).buffer, env());
    node.port.postMessage({ config: { prime, max } });
    node.connect(audio.destination);
    node.port.onmessage = (e) => {
      const s = e.data;
      if ("level" in s) {
        if (started) set_audio_level(s.level);
        return;
      }
      const db = s.played ? (10 * Math.log10(s.energy / s.played)).toFixed(0) : "-inf";
      // For measuring from outside the page (devtools, a test driver).
      window.remodelAudio = { dropouts: s.dropouts, dry: s.dry, queuedMs: s.queued / 44.1, workerMs, geoMs,
        bufferMs: (run ? S.effective(run, env()).audio.target : S.audioBuffer(values.buffer, env()).target) * 1000 };
      soundLabel.textContent = `sound: ${audio.state}, ${audio.sampleRate} Hz, ` +
        `worker ${workerState} ${workerMs.toFixed(1)} ms/frame, geometry worker ${geoMs.toFixed(1)} ms/frame, ` +
        `playing ${db} dB, ${s.dry} dry, ${s.dropouts} dropouts, ` +
        `${(s.queued / 44.1).toFixed(0)} ms queued`;
    };
    // The worker posts its audio straight into the worklet.
    connectAudio();
  }
  for (const ev of ["pointerdown", "keydown", "touchend"]) addEventListener(ev, () => run?.sound && enableAudio());

  // The bar's list of keys, as remapped.
  const showKeys = () => (document.getElementById("keys").textContent =
    controls_help(game, values.controls).trim().replace(/\n\s*/g, " · ").replace(/ {2,}/g, " ") + " · ");
  const toggleBar = () => document.getElementById("bar").classList.toggle("hidden");
  addEventListener("keydown", (e) => {
    if (e.code === "KeyF") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (e.code === "KeyH") toggleBar();
  });

  // Loading progress on the splash (and the panel, while it's open).
  const fill = document.getElementById("fill");
  const ptext = document.getElementById("ptext");
  const mb = (n) => (n / 1048576).toFixed(n < 10485760 ? 1 : 0);
  function progress(label, done, total) {
    fill.style.width = total ? `${Math.min(100, (100 * done) / total)}%` : "0";
    ptext.textContent = total ? `${label} ${mb(done)} / ${mb(total)} MB` : label;
    panel.setStatus(ptext.textContent);
  }
  // Fetch URLs (at most four at once), reporting bytes as they arrive.
  async function download(urls, label) {
    const got = new Array(urls.length).fill(0);
    const size = new Array(urls.length).fill(0);
    const update = () => progress(label, got.reduce((a, b) => a + b, 0), size.reduce((a, b) => a + b, 0));
    const out = new Array(urls.length);
    let next = 0;
    async function one() {
      while (next < urls.length) {
        const i = next++;
        const r = await fetch(urls[i]);
        if (!r.ok) throw new Error(`${urls[i]}: ${r.status} ${r.statusText}`);
        size[i] = Number(r.headers.get("content-length")) || 0;
        const reader = r.body.getReader();
        const parts = [];
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value);
          got[i] += value.length;
          update();
        }
        out[i] = new Blob(parts);
      }
    }
    await Promise.all(Array.from({ length: Math.min(4, urls.length) }, one));
    return out;
  }
  // The texture pack (docs/web.md, "Texture packs"): /texpack/<set>/,
  // beside /rom/, with an index.txt naming its files (a browser can't list a
  // folder, and asking for every texture the game draws would be a stream
  // of 404s); for a clone without one, its parent's (pack_sets: the keys are
  // the textures' content, so the parent's images serve every version). The
  // module asks for an image the first time its texture is drawn
  // (pack_wanted); a worker fetches and decodes it (pack-worker.js), at most
  // PACK_AHEAD at a time, and the page hands over one a frame, so the
  // renderer's upload of a large image doesn't pile up with others.
  const packFolder = (set) => new URL(`../../texpack/${set}/`, location.href).href;
  // The folder the pack in use came from (set by usePack, once the module
  // is initialised).
  let packUrl = packFolder(game);
  const PACK_AHEAD = 4;
  // Bumped by each usePack: an older loop (packTick) stops.
  let packGen = 0;
  let packWorker = null;
  let packQueue = [];
  let packDecoded = [];
  let packBusy = 0;
  // For a test driver: decode and hand-over times (ms), images and failures,
  // and the folder the pack came from.
  window.remodelPack = { images: 0, missing: 0, decodeMs: [], handMs: [], url: null };
  function packTick(gen) {
    if (gen !== packGen) return;
    if (started) {
      const hand = packDecoded.shift();
      if (hand) {
        const t = performance.now();
        pack_image(hand.name, hand.width, hand.height, hand.rgba);
        remodelPack.handMs.push(performance.now() - t);
        packBusy--;
      }
      for (const name of pack_wanted()) packQueue.push(name);
    }
    while (packBusy < PACK_AHEAD && packQueue.length) {
      const name = packQueue.shift();
      packBusy++;
      packWorker.postMessage({ type: "get", name, url: `${packUrl}${encodeURIComponent(name)}.png` });
    }
    requestAnimationFrame(() => packTick(gen));
  }
  async function usePack(on) {
    const gen = ++packGen;
    packQueue = [];
    packDecoded = [];
    packBusy = 0;
    if (!on) {
      set_pack(undefined);
      packWorker?.terminate();
      packWorker = null;
      return;
    }
    let index;
    const tried = [];
    for (const url of pack_sets(game).map(packFolder)) {
      try {
        const r = await fetch(url + "index.txt");
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        index = await r.text();
        packUrl = url;
        break;
      } catch (e) {
        tried.push(`${url}index.txt (${e.message ?? e})`);
      }
    }
    if (gen !== packGen) return;
    if (index === undefined) {
      console.warn(`texture pack: no ${tried.join(", no ")}: original textures`);
      set_pack(undefined);
      return;
    }
    remodelPack.url = packUrl;
    const names = set_pack(index);
    console.log(`texture pack: ${names} images listed in ${packUrl}index.txt`);
    packWorker?.terminate();
    packWorker = new Worker("../pack-worker.js", { type: "module" });
    packWorker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "image") {
        remodelPack.images++;
        remodelPack.decodeMs.push(m.ms);
        packDecoded.push(m);
      } else if (m.type === "missing") {
        remodelPack.missing++;
        console.warn(`texture pack: ${m.name}: ${m.message}`);
        pack_missing(m.name);
        packBusy--;
      }
    };
    try {
      packWorker.postMessage({ type: "init", pkg, module: packModule });
    } catch {
      packWorker.postMessage({ type: "init", pkg });
    }
    requestAnimationFrame(() => packTick(gen));
  }
  // The compiled module, for the pack worker (set once it's compiled).
  let packModule;
  const fail = (e) => {
    status.textContent = "error: " + (e.message ?? e);
    ptext.textContent = "Couldn't start: " + (e.message ?? e);
    ptext.style.color = "#f66";
    panel.setStatus(ptext.textContent, true);
    console.error(e);
  };

  if (!navigator.gpu) {
    ptext.textContent = "This browser has no WebGPU.";
    panel.setStatus("This browser has no WebGPU, which the game needs.", true);
    status.textContent = "This browser has no WebGPU (try a recent Chrome, Edge or Safari; on Linux, check chrome://gpu).";
  } else {
    try {
      // While the panel is up: the module, compiled once (the workers
      // instantiate the same one), then the ROMs, once, before anything
      // else asks for them: the workers and the game then get them from
      // the browser's cache.
      const [code] = await download([pkg + "remodel_web_bg.wasm"], "Game code");
      progress("Compiling…");
      const module = await WebAssembly.compile(await code.arrayBuffer());
      await init({ module_or_path: module });
      packModule = module;
      const layout = JSON.parse(touch_layout(game));
      panel.setGameCrease(game_crease(game));
      // The panel remaps through the module (romset::bindings), which keeps
      // the player's changes as text in the settings (`controls`).
      panel.setControls({
        view: (o) => JSON.parse(bindings_view(game, o)),
        capture: (o, slot, index, kind, value) => JSON.parse(bindings_capture(game, o, slot, index, kind, value)),
        edit: (o, op, slot, index) => bindings_edit(game, o, op, slot, index),
      }, layout);
      await download(rom_files(game).map((f) => `${rom}/${f}`), "ROMs");
      progress("Ready");
      // Wait for Play (the panel may also have been opened from the gear).
      while (panel.open) await choice;
      gear.hidden = true;
      run = { ...values };
      const opt = S.effective(values, env());
      progress("Starting…");
      document.title = `${game_title(game)} · reModel`;
      set_bindings(values.controls);
      showKeys();
      if (!opt.sound) soundLabel.textContent = "sound off";
      // On-screen controls (the game's, from its pad bindings): on touch
      // screens unless the settings say otherwise, with the bar out of the
      // way until ⓘ.
      const report = (steer, right, left, buttons) => started && set_touch(steer, right, left, buttons);
      // Gun games: the mouse or a tap aims and fires (gun.js).
      let gun;
      if (layout.gun) {
        const canvas = document.getElementById("screen");
        gun = setupGun(canvas, (x, y) => (started ? view_point(x, y) : []),
          (p, x, y, on, b) => started && set_gun(p, x, y, on, b));
        const track = () => {
          if (started) gun.cursor(stick_cursor());
          requestAnimationFrame(track);
        };
        requestAnimationFrame(track);
      }
      touch = setupTouch(layout, report, toggleBar, gun, opt.touch);
      if (touch.shown) toggleBar();
      if (opt.touch && opt.tilt) touch.tilt(true, tiltAsk ?? tiltPermission());
      tiltAsk = null;
      let link;
      if (opt.sound) {
        worker = new Worker("../sound-worker.js", { type: "module" });
        worker.onmessage = (e) => {
          const m = e.data;
          if (m.type === "stats") workerMs = m.msPerFrame;
          else if (m.type === "ready") workerState = "running";
          else if (m.type === "error") soundLabel.textContent = "sound worker: " + m.message;
        };
        try {
          worker.postMessage({ type: "init", pkg, module, game, rom, mix: opt.mix });
        } catch {
          // Browsers that can't pass a compiled module: the worker fetches it.
          worker.postMessage({ type: "init", pkg, game, rom, mix: opt.mix });
        }
        connectAudio();
        link = (cycles, bytes, until, ratio) =>
          worker.postMessage({ type: "link", cycles, bytes, until, ratio }, [cycles.buffer, bytes.buffer]);
      }
      // The geometrizer runs in its own worker too (the geo setting, or
      // ?geo=local, keeps it on this thread).
      let geo;
      if (!opt.geoLocal) {
        const gw = new Worker("../geo-worker.js", { type: "module" });
        gw.onmessage = (e) => {
          const m = e.data;
          // Undefined for a skipped frame; `between`: smooth motion's
          // in-betweens; `light`, `betweenLight`: smooth shading's side
          // channel for the frame and each in-between.
          if (m.type === "frame") set_geo_frame(m.stream, m.points, m.between, m.light, m.betweenLight);
          else if (m.type === "stats") geoMs = m.msPerFrame;
          else if (m.type === "error") {
            // The game waits for this worker: without it, run the
            // geometrizer on this thread instead.
            console.error("geometry worker: " + m.message);
            params.set("geo", "local");
            restart();
          }
        };
        const native = opt.geoNative;
        const smooth = opt.smooth;
        const light = wantsLight(opt);
        try {
          gw.postMessage({ type: "init", pkg, module, game, rom, native, smooth, light });
        } catch {
          gw.postMessage({ type: "init", pkg, game, rom, native, smooth, light });
        }
        geoWorker = gw;
        // `steps`: the in-betweens smooth motion wants per frame.
        geo = (kind, data, booted, readPtr, jumps, steps) =>
          kind === "boot"
            ? gw.postMessage({ type: "boot", program: data }, [data.buffer])
            : gw.postMessage({ type: "frame", buffer: data, booted, readPtr, jumps, steps },
              [data.buffer, jumps.buffer]);
      }
      set_smooth(opt.smooth);
      set_quality(opt.aa, opt.depth, opt.texFilter, opt.shading, opt.crease, opt.shadingFine);
      if (opt.pack) await usePack(true);
      set_audio_buffer(opt.audio.target);
      await start(game, document.getElementById("screen"), status, rom, opt.height, opt.aspect, opt.hudEdges, link, geo);
      started = true;
      startAspect = opt.aspect;
      placeBezel();
      // For a test driver: what the game started with.
      window.remodelSettings = { values: run, start: opt };
      // Smooth shading's grouping pass timed on this page: [median ms,
      // worst ms, polygons, lit] over `runs` passes on the newest frame.
      window.remodelShadingCost = (runs = 20) => Array.from(shading_cost(runs));
      // Fade the logo once it's been up for 1.5 s.
      const splash = document.getElementById("splash");
      setTimeout(() => splash.classList.add("gone"), Math.max(0, 1500 - performance.now()));
      splash.addEventListener("transitionend", () => splash.remove());
    } catch (e) {
      fail(e);
    }
  }
</script>
</body>
</html>
