[package]
name = "remodel-web"
description = "Remodel in a browser: WebAssembly, drawn with WebGPU"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is browser-only; on other targets the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
remodel-model2.workspace = true
remodel-romset.workspace = true
remodel-gpu.workspace = true
remodel-recomp.workspace = true
wgpu = "30.0.1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "KeyboardEvent", "Event", "EventTarget", "Response", "Performance", "Navigator", "Gamepad", "GamepadButton", "console"] }
