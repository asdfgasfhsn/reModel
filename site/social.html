<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>reModel social card (1200x630)</title>
<!-- Screenshot this page at 1200x630 into site/social.png (see site/README.md). Not linked from the site. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b3dff;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
.card{position:relative;width:1200px;height:630px;background:#0b3dff;color:#fff;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.2) 0 32%,transparent 36%);background-size:11px 11px;-webkit-mask-image:radial-gradient(closest-side at 85% 40%,#000,transparent);mask-image:radial-gradient(closest-side at 85% 40%,#000,transparent)}
.band{position:absolute;left:-10%;width:130%;transform:rotate(-24deg)}
.b1{bottom:70px;height:70px;background:#ee1d2e}.b2{bottom:150px;height:24px;background:#fff}
.mq{position:absolute;left:-30px;right:-30px;top:34px;height:130px;background:#050507;transform:rotate(-2.2deg);border-block:4px solid #fff;box-shadow:0 8px 0 #ee1d2e;display:flex;align-items:center;padding-left:70px}
.mq img{height:104px}
h1{position:absolute;left:34px;top:170px;font-style:italic;font-weight:900;text-transform:uppercase;line-height:.84;font-size:220px;transform:rotate(-2.4deg);transform-origin:0 100%;white-space:nowrap;text-shadow:-6px 0 0 #10dcff,6px 4px 0 #ee1d2e}
h1 span{display:block}
.sub{position:absolute;right:40px;bottom:36px;width:620px;text-align:right;font:600 26px/1.25 "IBM Plex Mono",monospace;letter-spacing:.02em;background:#050507;padding:12px 18px;transform:rotate(-1deg)}
.star{position:absolute;right:70px;top:290px;width:170px;height:170px;background:#ffe03a;color:#0b0b12;display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;font-weight:900;font-size:36px;line-height:.9;text-transform:uppercase;transform:rotate(10deg);
clip-path:polygon(100% 50%,88% 58.7%,95% 71.7%,80.5% 74.3%,81.2% 89.1%,66.9% 85.1%,61.1% 98.7%,50% 89%,38.9% 98.7%,33.1% 85.1%,18.8% 89.1%,19.5% 74.3%,5% 71.7%,12% 58.7%,0% 50%,12% 41.3%,5% 28.3%,19.5% 25.7%,18.8% 10.9%,33.1% 14.9%,38.9% 1.3%,50% 11%,61.1% 1.3%,66.9% 14.9%,81.2% 10.9%,80.5% 25.7%,95% 28.3%,88% 41.3%)}
</style>
</head>
<body>
<div class="card">
  <div class="band b1"></div><div class="band b2"></div>
  <div class="mq"><img src="logo.webp" alt="reModel"></div>
  <h1><span>Sega Model 2</span><span>on PC.</span></h1>
  <div class="star">34<br>games</div>
  <div class="sub">Open source. Bring your own ROMs.</div>
</div>
</body>
</html>
