[workspace]
resolver = "2"
members = ["crates/i960", "crates/romset", "crates/analyze", "crates/model2", "crates/mb86235", "crates/m68k", "crates/mpeg", "crates/dsb", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
i960 = { path = "crates/i960" }
remodel-romset = { path = "crates/romset" }
remodel-analyze = { path = "crates/analyze" }
remodel-model2 = { path = "crates/model2" }
mb86235 = { path = "crates/mb86235" }
m68k = { path = "crates/m68k" }
remodel-mpeg = { path = "crates/mpeg" }
remodel-dsb = { path = "crates/dsb" }

[profile.release]
debug = true
