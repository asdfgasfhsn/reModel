[workspace]
resolver = "2"
members = ["crates/i960", "crates/romset", "crates/analyze", "crates/model2", "crates/mb86235", "crates/mb86234", "crates/adsp2106x","crates/m68k", "crates/sound", "crates/mpeg", "crates/dsb", "crates/png", "crates/gpu", "crates/web", "crates/play", "crates/state", "crates/version", "crates/z80", "crates/recomp", "crates/jit", "crates/linknet", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.14.0"
license = "MIT"

[workspace.dependencies]
i960 = { path = "crates/i960" }
remodel-romset = { path = "crates/romset" }
remodel-analyze = { path = "crates/analyze" }
remodel-model2 = { path = "crates/model2" }
mb86235 = { path = "crates/mb86235" }
mb86234 = { path = "crates/mb86234" }
adsp2106x = { path = "crates/adsp2106x" }
m68k = { path = "crates/m68k" }
remodel-sound = { path = "crates/sound" }
remodel-mpeg = { path = "crates/mpeg" }
remodel-dsb = { path = "crates/dsb" }
remodel-png = { path = "crates/png" }
remodel-gpu = { path = "crates/gpu" }
remodel-state = { path = "crates/state" }
remodel-version = { path = "crates/version" }
remodel-z80 = { path = "crates/z80" }
remodel-recomp = { path = "crates/recomp" }
remodel-jit = { path = "crates/jit" }
remodel-linknet = { path = "crates/linknet" }

[profile.release]
debug = true

# Tests drive third-party code hard (the JIT's checks compile thousands of
# random programs with Cranelift): built unoptimised, the jit tests took 544 s
# of the gate; with the dependencies optimised (built once, then cached), 33 s.
# Our own crates stay unoptimised, with debug assertions and overflow checks.
[profile.test.package."*"]
opt-level = 2
