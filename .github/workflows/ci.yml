# What `make check` runs, on every push to main and every pull request:
# formatting, clippy with warnings as errors, the unit tests (no ROMs; the
# GPU tests skip on a runner without one) and the browser build's type
# check. docs/usage.md, "Continuous integration".
name: check

on:
  push:
    branches: [main]
    # Docs and the website change nothing the check runs.
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # rustc's own stack, for the largest generated functions.
  RUST_MIN_STACK: "67108864"
  # CI never needs debug info; without it the build is smaller and lighter.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for sound, udev for gamepads)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      # The toolchain this checkout is checked with (`rustc -V` on the
      # main machine): a newer clippy brings new lints. Bump together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # A fresh cache for the builds without debug info: restoring the
          # old one (with it) and building beside it ran the runner out of
          # room, losing every run and its log (2026-11-25).
          prefix-key: v1-nodebug
          workspaces: |
            . -> target
          cache-directories: target/web
      # Cargo.toml builds the tests' dependencies, model2 and gpu optimised:
      # a quarter of the test time on a big machine, but on the 4-CPU runner
      # a cold build that never finished in 40 minutes (2026-11-25; before,
      # the whole check took 13-15). CI builds them as it did before.
      - name: Unoptimised test builds
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [profile.test.package."*"]
          opt-level = 0
          [profile.test.package.remodel-state]
          opt-level = 0
          [profile.test.package.remodel-model2]
          opt-level = 0
          [profile.test.package.remodel-gpu]
          opt-level = 0
          EOF
      - run: make fmt-check
      - run: make lint
      # Building and running apart, with the disk and memory shown between,
      # so a runner that dies says at which (runs since 2026-11-25 lost
      # theirs with no log).
      - name: Disk and memory before the test build
        run: df -h / && free -m && du -sh target 2>/dev/null || true
      - name: Build the tests
        run: cargo test --workspace --no-run
        timeout-minutes: 25
      - name: Disk and memory after the test build
        run: df -h / && free -m && du -sh target 2>/dev/null || true
      # One step per heavy crate for now: a runner that dies keeps the
      # steps before it, so this names the one that kills it (2026-11-25).
      - name: Test jit
        run: REMODEL_GPU_TESTS=1 cargo test -p remodel-jit
        timeout-minutes: 15
      - name: Test model2
        run: REMODEL_GPU_TESTS=1 cargo test -p remodel-model2
        timeout-minutes: 15
      - name: Test gpu
        run: REMODEL_GPU_TESTS=1 cargo test -p remodel-gpu
        timeout-minutes: 10
      - name: Test play
        run: REMODEL_GPU_TESTS=1 cargo test -p remodel-play
        timeout-minutes: 10
      - name: Test linknet and the CLI
        run: REMODEL_GPU_TESTS=1 cargo test -p remodel-linknet -p remodel
        timeout-minutes: 10
      - run: make test
        timeout-minutes: 25
      - run: make web-check WASM_RUSTUP=$(command -v rustup)
