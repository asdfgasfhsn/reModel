# What `make check` runs, on every push to main and every pull request:
# formatting, clippy with warnings as errors, the unit tests (no ROMs; the
# GPU tests skip on a runner without one) and the browser build's type
# check. docs/usage.md, "Continuous integration".
name: check

on:
  push:
    branches: [main]
    # Docs and the website change nothing the check runs.
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # rustc's own stack, for the largest generated functions.
  RUST_MIN_STACK: "67108864"
  # The runner has 4 CPUs and 16 GB: tests' dependencies are built optimised
  # (Cargo.toml), which with debug info and four compilers at once starved
  # it (a run lost its runner after 52 minutes, 2026-11-25). CI never needs
  # the debug info; two compilers at once keep the memory down.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for sound, udev for gamepads)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      # The toolchain this checkout is checked with (`rustc -V` on the
      # main machine): a newer clippy brings new lints. Bump together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-directories: target/web
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make web-check WASM_RUSTUP=$(command -v rustup)
